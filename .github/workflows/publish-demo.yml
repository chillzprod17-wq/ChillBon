name: Publish ChillBon browser demo

on:
  push:
    branches: [volt-migration]
    paths:
      - '.github/workflows/publish-demo.yml'
      - 'play/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch playable offline demo from migration branch
        run: |
          git fetch origin volt-migration
          mkdir -p play
          git show origin/volt-migration:play/index.html > play/index.html
          test -s play/index.html
      - name: Download and verify official Volt v1.0.14
        run: |
          curl --fail --location --retry 3 \
            https://github.com/plus-emulator/Volt/releases/download/v1.0.14/volt-client.zip \
            --output /tmp/volt-client.zip
          echo "188cafcaf6ced436f4c4b429e97bd11ad1b2487d232515ef0266b7f24b211636  /tmp/volt-client.zip" | sha256sum --check
          mkdir -p demo
          unzip -q -o /tmp/volt-client.zip -d demo
          test -f demo/index.html
      - name: Add honest preview notice
        run: |
          cat > demo/README-PREVIEW.txt <<'EOF'
          ChillBon preview of upstream Volt v1.0.14.
          This is a static client preview, not a playable multiplayer hotel.
          PlusEMU, CMS SSO login, WebSocket, database and game assets are still required.
          EOF
          touch .nojekyll
      - name: Commit demo to existing Pages source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo play .nojekyll
          if git diff --cached --quiet; then
            echo "Demo already up to date"
          else
            git commit -m "Publish verified Volt demo at /demo"
            git push origin HEAD:main
          fi
