name: Publish ChillBon browser demo

on:
  workflow_dispatch:
  push:
    branches: [volt-migration]
    paths:
      - '.github/workflows/publish-demo.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chillbon-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout existing site
        uses: actions/checkout@v4
        with:
          ref: main
          path: existing
      - name: Preserve existing homepage
        run: |
          mkdir -p public/demo
          cp existing/index.html public/index.html
          touch public/.nojekyll
      - name: Download verified Volt release
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/plus-emulator/Volt/releases/download/v1.0.14/volt-client.zip" \
            --output volt-client.zip
          echo "188cafcaf6ced436f4c4b429e97bd11ad1b2487d232515ef0266b7f24b211636  volt-client.zip" | sha256sum --check
          unzip -q volt-client.zip -d public/demo
          test -f public/demo/index.html
      - name: Explain demo limitations
        run: |
          cat > public/demo/DEMO-NOTICE.txt <<'EOF'
          ChillBon preview of upstream Volt v1.0.14.
          A static client requires PlusEMU, CMS login/SSO, WebSocket, database and assets to play.
          This is not a functional multiplayer hotel.
          EOF
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
